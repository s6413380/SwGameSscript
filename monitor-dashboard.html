<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愛吉吉 多帳號總覽</title>
<style>
  :root { --bg:#111114; --card:#1b1b1f; --line:#3a3a40; --text:#fff; --muted:#a0a0aa;
    --good:#43a047; --warn:#f9a825; --bad:#e53935; --sp:#1e88e5; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.5 sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  .total { color:#ffe066; font-weight:bold; }
  .muted { color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card.alert { background:#5a1414; border:3px solid #ffe066; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .name { font-weight:bold; font-size:16px; }
  .money { color:#ffe066; font:bold 15px monospace; }
  .badge { display:inline-block; padding:0 6px; border-radius:4px; font-size:12px; background:#3a3a42; }
  .badge.run { background:var(--good); }
  .badge.stop { background:#555; }
  .badge.bad { background:var(--bad); }
  .alert-text { color:#ffe066; font-weight:bold; margin:6px 0; }
  .hero { margin:6px 0; }
  .hero-line { display:flex; justify-content:space-between; gap:6px; font-size:13px; }
  .income-board { margin:0 0 12px; padding:8px 10px; border:1px solid #2e2e34; border-radius:8px; background:#18181b; }
  .income-board .periods button { margin-left:4px; }
  .forge-board { margin:16px 0 0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#18181b; }
  .forge-board .head { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .forge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:10px; margin-top:8px; }
  .forge-account { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .forge-account .title { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .forge-account .settings { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin:6px 0; font-size:13px; color:var(--muted); }
  .forge-account button.on { background:var(--good); border-color:var(--good); font-weight:bold; }
  .forge-hero { border:1px solid #2e2e34; border-radius:8px; padding:6px 8px; margin:5px 0; background:#1c1c21; }
  .forge-hero.next { background:#16261c; border-color:#2f5d3a; }
  .forge-hero .line { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .forge-hero .status { flex:1; text-align:right; font-size:12px; }
  .forge-hero .type { padding:0 6px; border-radius:9px; background:#3b2f5c; color:#ddd6fe; font-size:12px; }
  .chip { display:inline-block; margin:1px 3px 1px 0; padding:0 6px; border-radius:9px; background:#2a2a30; font-size:12px; }
  .chip.short { background:#5c1d1d; color:#fca5a5; }
  .forge-editor { margin-top:6px; padding:8px; border-radius:6px; background:#141418; display:grid; grid-template-columns:auto 1fr; gap:5px 8px; align-items:center; font-size:13px; }
  .forge-editor input, .forge-editor select { width:100%; box-sizing:border-box; }
  .income-board .periods button.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  .income-board table { width:100%; border-collapse:collapse; margin-top:6px; font-size:13px; }
  .income-board th, .income-board td { padding:3px 6px; border-bottom:1px solid #26262b; text-align:right; white-space:nowrap; }
  .income-board th:first-child, .income-board td:first-child, .income-board th:last-child, .income-board td.items { text-align:left; }
  .income-board td.items { white-space:normal; color:#a0a0aa; font-size:12px; }
  .income-board tr.total td { font-weight:bold; border-top:2px solid #3a3a42; }
  .income { font-size:12px; margin:4px 0 2px; padding:3px 6px; border-radius:4px; background:#1c1c22; }
  .income b { color:#93c5fd; font-weight:normal; }
  .cond { display:inline-block; margin-left:4px; padding:0 4px; border-radius:3px; font-size:11px; color:#fff; }
  .cond.s1 { background:#854d0e; }
  .cond.s2 { background:#c2410c; }
  .cond.s3 { background:#b91c1c; font-weight:bold; }
  .bar { height:8px; background:#2a2a30; border-radius:4px; overflow:hidden; margin-top:2px; }
  .bar > div { height:100%; }
  .bar.sp { height:4px; }
  .status { margin-top:8px; font:12px monospace; color:var(--muted); word-break:break-all; }
  button { padding:2px 8px; cursor:pointer; font-size:12px; color:#fff; background:#3a3a42;
    border:1px solid #4a4a52; border-radius:5px; }
  button:hover { background:#4a4a54; }
  button.small { padding:0 5px; font-size:11px; }
  .global button[data-current="run"] { background:#2e7d32; border-color:#2e7d32; font-weight:bold; }
  .global button[data-current="temp"] { background:#e65100; border-color:#e65100; font-weight:bold; }
  .global button[data-low-current] { background:#2e7d32; border-color:#2e7d32; font-weight:bold; }
  .global button[data-current="stop"] { background:#c62828; border-color:#c62828; font-weight:bold; }
  .queue { font-size:13px; margin:-4px 0 10px; }
  .last-action.stuck { color:#ffe066; font-weight:bold; }
  .focus-name { cursor:pointer; text-decoration:underline dotted; }
  .focus-name:hover { color:#90caf9; }
  input, select { padding:2px 4px; font:12px monospace; color:#fff; background:#2a2a30; border:1px solid #44444c; border-radius:4px; }
  input[type="number"] { width:56px; }
  input[type="checkbox"] { accent-color:#fff; }
  details { margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }
  summary { cursor:pointer; font-weight:bold; font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .fields { display:grid; grid-template-columns:1fr auto; gap:4px 8px; font-size:12px; align-items:center; }
  /* 左邊色條分辨分頁：橘＝鍛造、藍＝狩獵 */
  .card.forge { border-left:6px solid #ff9800; }
  .card.hunt { border-left:6px solid #42a5f5; }
  .badge.forge { background:#e65100; }
  .badge.hunt { background:#1565c0; }
  .card.forge .hunt-only { display:none; }
  .card.collapsed [data-role="detail"], .card.collapsed details { display:none; }
  .card.collapsed { padding:6px 10px; }
  .brief { font-size:12px; margin-top:2px; }
  .card:not(.collapsed) .brief { display:none; }
  .forge-progress { font:12px monospace; margin:6px 0; }
  .mode { margin:4px 0; font-size:12px; }
  .mode button.on { background:var(--good); border-color:var(--good); font-weight:bold; }
  button.sent { outline:2px solid #3b82f6; outline-offset:1px; }
</style>
</head>
<body>
<header>
  <h1>愛吉吉 多帳號總覽</h1>
  <span class="total" id="total"></span>
  <span class="muted" id="updated"></span>
  <button id="collapse-all">全部縮小</button><button id="expand-all">全部展開</button>
  <button id="reload-all" title="更新腳本後按這個：每個分頁重新整理，原本在跑的會自動接著跑">全部重新整理</button>
  <span class="global">全體
    <button data-global="run">開始</button><button data-global="temp">暫時暫停</button><button data-global="stop">永久暫停</button>
    <input id="global-minutes" type="number" min="1" value="10" style="width:48px"> 分鐘
    <span class="muted" id="global-text"></span></span>
  <span class="global">低調
    <button data-low="off">關</button><button data-low="serious">認真</button><button data-low="casual">休閒</button><button data-low="auto" title="認真時段（遊戲面板設定，預設 20-24 點）認真玩，其他時間休閒">自動</button>
    休閒每小時 <input id="low-casual-minutes" type="number" min="0" max="60" style="width:48px"> 分鐘
    自動：<input id="low-serious-hours" placeholder="20-24" style="width:90px" title="這些時段認真玩，其他時間休閒；可寫多段 12-13,20-24"> 點認真
    睡覺 <input id="low-sleep-hours" placeholder="留空＝不睡" style="width:60px" title="每天睡覺時段，只能一段，例：2-9；不會比設定早睡"> 點
    完全休息 <input id="low-off-hours" placeholder="留空＝沒有" style="width:90px" title="這些時段完全不動，跟睡覺一樣；可寫多段 9-12,14-17"> 點
    <span id="low-schedule" style="color:#c4b5fd"></span>
    小號頻率 <input id="side-hunt-percent" type="number" min="10" max="100" step="5" style="width:52px" title="主帳號照常打，其他帳號打怪頻率是主帳號的幾 %；主帳號在各帳號卡片上設"> %
    <span class="muted" id="low-text"></span></span>
</header>
<div class="queue" id="queue"></div>
<section class="income-board" id="income-board" style="display:none">
  <div class="periods"><b>收益</b><span id="income-periods"></span></div>
  <table id="income-table"></table>
  <div class="muted" style="font-size:12px;margin-top:4px">經驗＝整隊加總；💰＝遊戲幣餘額淨變化（含花掉的）；同一個帳號開兩個分頁只算一次</div>
</section>
<div class="grid" id="grid"><div class="muted" id="empty">目前沒有在線的分頁；在遊戲面板「提醒」頁勾選「回報到總覽頁」</div></div>
<section class="forge-board" id="forge-board" style="display:none">
  <div class="head"><b>鍛造</b>
    <button id="forge-start-all">全部開始</button><button id="forge-stop-all">全部停止</button>
    全部帳號的名稱 <input id="forge-name-all" style="width:120px"> <button id="forge-name-all-send">套用到全部帳號</button>
    <span class="muted" id="forge-board-text"></span></div>
  <div class="forge-grid" id="forge-board-body"></div>
</section>
<script>
  // 超過這麼久沒回報就當作分頁關掉或卡住，先不顯示，等它再回報時自然會回來
  const OFFLINE_MILLISECONDS = 30000;
  // 按下後到分頁真的套用要幾秒，這段時間內不拿回報的舊值蓋掉剛改的
  const EDIT_HOLD_MILLISECONDS = 12000;
  const CHECKBOX_FIELDS = [
    ['healthApiEnabled', '自動補血（API）'],
    ['resourceApiEnabled', '自動補體力（API）'],
    ['equipApiEnabled', '自動換裝（API）'],
    ['stageEnabled', '自動移動'],
    ['loop', '休息後重新循環'],
  ];
  const NUMBER_FIELDS = [
    ['healthThresholdPercent', '血量低於 %'],
    ['healthTargetPercent', '血量補到 %'],
    ['resourceThresholdPercent', '體力低於 %'],
    ['resourceTargetPercent', '體力補到 %'],
    ['repeatCount', '掛機幾次後休息'],
    ['loopDelaySeconds', '休息後幾秒重新循環'],
    ['intervalMinSeconds', '掛機間隔最短秒'],
    ['intervalMaxSeconds', '掛機間隔最長秒'],
  ];
  const cards = new Map();
  // 中繼站上目前的版本；分頁回報的版本跟它不同就標黃，一眼看出哪個分頁還沒更新
  let latestVersion = '';

  function versionHtml(version) {
    if (!version) return '<span class="muted">版本？</span>';
    const outdated = latestVersion && version !== latestVersion;
    return outdated
      ? `<span class="badge" style="background:#8d6e00" title="中繼站上是 v${escapeHtml(latestVersion)}">v${escapeHtml(version)} 舊版</span>`
      : `<span class="muted">v${escapeHtml(version)}</span>`;
  }
  const COLLAPSED_STORAGE_KEY = 'monitorDashboardCollapsed';

  function loadCollapsed() {
    try {
      return new Set(JSON.parse(localStorage.getItem(COLLAPSED_STORAGE_KEY) || '[]'));
    } catch {
      return new Set();
    }
  }

  const collapsed = loadCollapsed();

  function saveCollapsed() {
    try {
      localStorage.setItem(COLLAPSED_STORAGE_KEY, JSON.stringify([...collapsed]));
    } catch {
      // 記不住就只影響重新整理後的樣子
    }
  }

  function setCollapsed(accountId, value) {
    if (value) collapsed.add(accountId);
    else collapsed.delete(accountId);
    saveCollapsed();
    const card = cards.get(accountId);
    if (card) card.classList.toggle('collapsed', value);
  }

  function remainingText(completeAt) {
    const seconds = Math.max(0, Math.round((new Date(completeAt).getTime() - Date.now()) / 1000));
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  }

  function forgeHeroHtml(hero) {
    const sp = percent(hero.sp, hero.fullSp);
    const state = hero.canComplete
      ? '<span style="color:#ffe066">可完成</span>'
      : hero.forging
        ? `鍛造中${hero.shop ? `（坊 ${hero.shop}）` : ''} 剩 ${hero.completeAt ? remainingText(hero.completeAt) : '?'}`
        : '閒置';
    return `<div class="hero">
      <div class="hero-line"><span>${escapeHtml(hero.name)} <span class="muted">Lv.${hero.lv}</span></span>
        <span>${state}・體 ${hero.sp}/${hero.fullSp}</span></div>
      <div class="bar"><div style="width:${sp}%;background:${hpColor(sp)}"></div></div>
    </div>`;
  }

  // 縮小時只留一行重點：狩獵看位置與最低血量，鍛造看進度
  function briefText(data) {
    // 同一個分頁一邊打怪一邊鍛造時，鍛造分頁也要看得到在哪裡掛機
    if (data.role === 'forge') return [data.huntRunning && data.location, data.forge && data.forge.progress ? `鍛造 ${data.forge.progress}` : ''].filter(Boolean).join('・');
    const lowest = data.heroes.reduce((min, hero) => Math.min(min, percent(hero.hp, hero.fullHp)), 100);
    return [data.location, data.heroes.length ? `最低血 ${Math.floor(lowest)}%` : ''].filter(Boolean).join('・');
  }

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, (char) => `&#${char.charCodeAt(0)};`);
  }

  function percent(value, full) {
    return full ? Math.max(0, Math.min(100, (value / full) * 100)) : 0;
  }

  function hpColor(value) {
    return value < 30 ? 'var(--bad)' : value < 60 ? 'var(--warn)' : 'var(--good)';
  }

  async function sendCommand(accountId, command) {
    try {
      const response = await fetch(`/command?id=${encodeURIComponent(accountId)}`, { method: 'POST', body: JSON.stringify(command) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      // 分頁每秒拿指令、做完馬上回報：1.5 秒後就重抓一次，不用等下一輪
      setTimeout(refresh, 1500);
      setTimeout(refresh, 3500);
    } catch (error) {
      alert(`送出指令失敗：${error.message}`);
    }
  }

  function levelText(hero) {
    if (hero.lv === undefined) return '';
    const exp = hero.fullExp ? `（${Math.floor(percent(hero.exp, hero.fullExp))}%）` : '';
    return ` <span class="muted">Lv.${hero.lv}${exp}</span>`;
  }

  // 中毒、燒傷這類異常，顏色依程度：輕度黃褐、中度橘、重度紅
  function conditionsHtml(hero) {
    return (hero.conditions || [])
      .map((condition) => `<span class="cond s${condition.severity}" title="${escapeHtml(condition.level + condition.name)}">${escapeHtml(condition.level)}${escapeHtml(condition.name)}</span>`)
      .join('');
  }

  function heroHtml(hero) {
    const hp = percent(hero.hp, hero.fullHp);
    const sp = percent(hero.sp, hero.fullSp);
    const dead = hero.perished || hero.hp === 0;
    const healButtons = hero.id
      ? `<button class="small" data-heal="health" data-hero="${hero.id}" title="吃 1 個補血道具">＋血</button>
         <button class="small" data-heal="resource" data-hero="${hero.id}" title="吃 1 個補體力道具">＋體</button>`
      : '';
    return `<div class="hero">
      <div class="hero-line"><span>${escapeHtml(hero.name)}${dead ? ' 💀' : ''}${levelText(hero)}${conditionsHtml(hero)}</span>
        <span>血 ${hero.hp}/${hero.fullHp}（${Math.floor(hp)}%）・體 ${hero.sp}/${hero.fullSp} ${healButtons}</span></div>
      <div class="bar"><div style="width:${hp}%;background:${hpColor(hp)}"></div></div>
      <div class="bar sp"><div style="width:${sp}%;background:var(--sp)"></div></div>
    </div>`;
  }

  function badgeHtml(data) {
    if (data.alert) return '<span class="badge bad">已暫停</span>';
    if (!data.running) return '<span class="badge stop">已停止</span>';
    // 新版會分開回報打怪、鍛造（同一個分頁可以一起跑）；舊版只看 forgeMode
    const doing = 'huntRunning' in data ? [data.huntRunning ? '掛機中' : '', data.forgeRunning ? '鍛造中' : ''].filter(Boolean) : [data.forgeMode ? '鍛造中' : '掛機中'];
    return `<span class="badge run">${doing.join('＋')}</span>`;
  }

  function signed(value) {
    return value === null || value === undefined ? '-' : `${value >= 0 ? '+' : ''}${Math.round(value).toLocaleString()}`;
  }

  // 收益：近 1 小時與今天的經驗、道具、遊戲幣淨變化（遊戲幣含花掉的）
  function incomeHtml(data) {
    if (!data.income) return '';
    const part = (label, income) =>
      `<b>${label}</b> ${income.battles} 場・經驗 ${income.exp.toLocaleString()}・撿到 ${income.items.toLocaleString()}${income.used === undefined ? '' : `・吃掉 ${income.used.toLocaleString()}`}・${income.net === undefined ? `💰 ${signed(income.money)}` : `純收益 ${signed(income.net)}`}`;
    return `<div class="income">${part('近1小時', data.income.hour)}<br>${part('今天', data.income.today)}</div>`;
  }

  const MINING_SITE_NAMES = { 1: '砂石場', 2: '森林區', 3: '鐵礦山', 4: '阿嬤寶山' };
  // 主動收礦要不要先派工頭：卡片每幾秒重畫，勾選記在這裡
  let collectWithForeman = true;
  document.addEventListener('change', (event) => {
    if (event.target.matches && event.target.matches('[data-collect-foreman]')) collectWithForeman = event.target.checked;
  });

  // 誰在挖礦、挖多久、有沒有中毒；角色資料最多 5 分鐘讀一次，挖了多久是照開挖時間現算的
  function miningHtml(data) {
    const mining = data.mining;
    if (!mining || !mining.heroes.length) return '';
    const rows = mining.heroes
      .map((hero) => `<div>${escapeHtml(hero.name)}：${escapeHtml(hero.text)}${hero.conditions.length ? ` <span style="color:#fb923c">${escapeHtml(hero.conditions.join('、'))}</span>` : ''}</div>`)
      .join('');
    const last = mining.last ? `<div class="muted">上次：${escapeHtml(mining.last.name)} ${escapeHtml(mining.last.text || '-')}</div>` : '';
    // 點一下切換：亮的＝不理會，有這個異常也照常挖
    const ignored = mining.ignoredConditions || [];
    const ignore = (mining.conditionNames || []).length
      ? `<div class="muted">不理會的異常：${mining.conditionNames
          .map((name) => `<button class="small ${ignored.includes(name) ? 'on' : ''}" data-command="mining-ignore" data-name="${escapeHtml(name)}" data-ignore="${ignored.includes(name) ? '' : '1'}" title="${ignored.includes(name) ? '目前不理會，按一下改回會擋' : '目前會擋（不出發、提早收），按一下改成不理會'}">${escapeHtml(name)}</button>`)
          .join('')}</div>`
      : '';
    // 主動收礦：有人在挖的地點各一個按鈕；有工頭才給「先派工頭」
    const sites = [...new Set(mining.heroes.map((hero) => hero.site).filter(Boolean))].sort();
    const collect = sites.length
      ? `<div class="muted">收礦：${[0, ...sites]
          .map((site) => `<button class="small" data-command="mining-collect" data-site="${site}">${site ? MINING_SITE_NAMES[site] || site : '全部'}</button>`)
          .join('')}${mining.foreman ? ` <label><input type="checkbox" data-collect-foreman ${collectWithForeman ? 'checked' : ''}> 先派工頭（${escapeHtml(mining.foreman)}）</label>` : ''}${mining.busy ? ` <span style="color:#facc15">${escapeHtml(mining.busy)}中…</span>` : ''}</div>`
      : '';
    return `<div class="income"><b>挖礦</b> <span class="muted">${Math.round((Date.now() - mining.at) / 60000)} 分鐘前讀取</span>${rows}${last}${collect}${ignore}</div>`;
  }

  // 今天戰報寫明是誰拿到的：每個角色一行，盜取放最前面
  // 卡片每幾秒重畫，展開過的「誰拿到」要記著，不然一直被收回去
  const openedLoot = new Set();
  document.addEventListener('toggle', (event) => {
    const key = event.target.dataset && event.target.dataset.lootKey;
    if (!key) return;
    if (event.target.open) openedLoot.add(key);
    else openedLoot.delete(key);
  }, true);

  function actorLootHtml(data) {
    if (!Array.isArray(data.actorLoot) || !data.actorLoot.length) return '';
    const stolen = (actor) => (actor.money && actor.money['盜取']) || 0;
    const rows = [...data.actorLoot]
      .sort((first, second) => stolen(second) - stolen(first))
      .map((actor) => {
        const money = Object.entries(actor.money || {})
          .sort(([first], [second]) => (first === '盜取' ? -1 : second === '盜取' ? 1 : 0))
          .map(([verb, amount]) => `${escapeHtml(verb)} $${Number(amount).toLocaleString()}`);
        // 舊版分頁只送前 3 樣（topItems），新版送全部（allItems）
        const list = actor.allItems || actor.topItems || [];
        const chip = ([item, quantity, rare]) => (rare ? `<b style="color:#fbbf24">${escapeHtml(item)}×${quantity}</b>` : `${escapeHtml(item)}×${quantity}`);
        const shown = list.slice(0, 3).map(chip).join('、');
        const items = actor.items ? [`道具 ${actor.items} 件${shown ? `（${shown}${list.length > 3 ? '…' : ''}）` : ''}`] : [];
        const head = `${escapeHtml(actor.name)}${actor.ours ? '' : ' <span style="color:#f87171">不是我方</span>'}：${[...money, ...items].join('・') || '-'}`;
        if (list.length <= 3) return `<div>${head}</div>`;
        const key = `${data.nickname}|${actor.name}`;
        return `<details data-loot-key="${escapeHtml(key)}" ${openedLoot.has(key) ? 'open' : ''}><summary style="cursor:pointer">${head} <span class="muted">（全部 ${list.length} 樣，點開）</span></summary>
          <div style="margin-left:12px">${list.map(chip).join('、')}</div></details>`;
      })
      .join('');
    return `<div class="income"><b>今天誰拿到</b>${rows}</div>`;
  }

  const INCOME_PERIODS = [
    ['hour', '近1小時'],
    ['six', '近6小時'],
    ['today', '今天'],
    ['day', '近24小時'],
    ['week', '近7天'],
  ];
  const INCOME_PERIOD_STORAGE_KEY = 'monitorDashboardIncomePeriod';
  let incomePeriod = 'today';
  try {
    incomePeriod = localStorage.getItem(INCOME_PERIOD_STORAGE_KEY) || 'today';
  } catch {
    // 記不住就用今天
  }
  let lastIncomeAccounts = [];

  function itemsText(items) {
    return items.map(([name, quantity]) => `${escapeHtml(name)}×${Number(quantity).toLocaleString()}`).join('、') || '-';
  }

  // 每個帳號一列：同帳號的分頁共用同一份紀錄，取最新回報的那個
  function renderIncomeBoard(accounts) {
    lastIncomeAccounts = accounts;
    // 沒有這段期間資料的帳號也要列出來，並寫出原因，不然看起來像少算
    const byAccount = new Map();
    [...accounts]
      .sort((first, second) => first.at - second.at)
      .forEach((account) => {
        const key = account.data.accountId ?? account.id;
        const income = account.data.income && account.data.income[incomePeriod];
        const previous = byAccount.get(key);
        // 同帳號的分頁取有資料的那個；都有就取最新回報的
        if (previous && previous.income && !income) return;
        byAccount.set(key, { name: account.data.nickname, income, version: account.data.version, enabled: account.data.income !== null });
      });
    const board = document.getElementById('income-board');
    const withIncome = [...byAccount.values()].filter(({ income }) => income);
    board.style.display = byAccount.size ? '' : 'none';
    if (!byAccount.size) return;
    document.getElementById('income-periods').innerHTML = INCOME_PERIODS.map(
      ([key, label]) => `<button class="small ${key === incomePeriod ? 'active' : ''}" data-income-period="${key}">${label}</button>`
    ).join('');
    const rows = withIncome.sort((first, second) => second.income.exp - first.income.exp);
    const missing = [...byAccount.values()].filter(({ income }) => !income);
    const missingReason = ({ version, enabled }) =>
      !enabled ? '沒開「記錄收益」' : `腳本 v${version || '?'} 太舊，沒有這段期間的資料（更新到 v2.52 以上）`;
    const total = { battles: 0, exp: 0, items: 0, used: 0, earned: 0, spent: 0, net: 0, market: 0, hasLedger: false, hours: 0, itemMap: new Map(), usedMap: new Map(), inMap: new Map(), outMap: new Map() };
    rows.forEach(({ income }) => {
      total.battles += income.battles;
      total.exp += income.exp;
      total.items += income.items;
      total.used += income.used || 0;
      (income.topUsed || []).forEach(([name, quantity]) => total.usedMap.set(name, (total.usedMap.get(name) || 0) + quantity));
      // 舊版腳本沒有收支分類（只有餘額變化），不算進合計
      if (income.net !== undefined) {
        ['earned', 'spent', 'net', 'market'].forEach((field) => (total[field] += income[field] || 0));
        total.hasLedger = true;
        (income.topIn || []).forEach(([label, amount]) => total.inMap.set(label, (total.inMap.get(label) || 0) + amount));
        (income.topOut || []).forEach(([label, amount]) => total.outMap.set(label, (total.outMap.get(label) || 0) + amount));
      }
      total.hours = Math.max(total.hours, income.hours || 0);
      (income.topItems || []).forEach(([name, quantity]) => total.itemMap.set(name, (total.itemMap.get(name) || 0) + quantity));
    });
    const perHour = (exp, hours) => (hours ? Math.round(exp / Math.max(hours, 1 / 6)).toLocaleString() : '-');
    const moneyCell = (value, style = '') => `<td style="color:${value === null || value === undefined ? '#a0a0aa' : value >= 0 ? '#4ade80' : '#f87171'};${style}">${signed(value)}</td>`;
    const sourcesText = (entries) => entries.map(([label, amount]) => `${escapeHtml(label)} ${Math.round(amount).toLocaleString()}`).join('、') || '-';
    // 舊版腳本只有餘額變化，收支欄位顯示 -
    const ledgerCells = (income) =>
      income.net === undefined
        ? '<td>-</td><td>-</td><td>-</td><td>-</td>'
        : `${moneyCell(income.earned)}${moneyCell(income.spent ? -income.spent : 0)}${moneyCell(income.net, 'font-weight:bold')}<td style="color:#a0a0aa">${signed(income.market)}</td>`;
    const row = (name, income, items, usedItems, className = '') => `<tr class="${className}"><td>${name}</td><td>${income.battles.toLocaleString()}</td><td>${income.exp.toLocaleString()}</td>
      <td>${perHour(income.exp, income.hours)}</td><td>${income.items.toLocaleString()}</td><td>${income.used === undefined ? '-' : income.used.toLocaleString()}</td>${ledgerCells(income)}<td class="items">${income.net === undefined ? '-' : `收 ${sourcesText(income.topIn || [])}<br>支 ${sourcesText(income.topOut || [])}`}</td><td class="items">${items}</td><td class="items">${usedItems}</td></tr>`;
    document.getElementById('income-table').innerHTML =
      '<tr><th>帳號</th><th>場</th><th>經驗</th><th>經驗/時</th><th>撿到</th><th>吃掉</th><th>收入</th><th>支出</th><th>純收益</th><th title="拍賣與不明入帳，不算進純收益">拍賣（不計）</th><th>錢的來源</th><th>主要道具</th><th>吃掉的補品</th></tr>' +
      rows.map(({ name, income }) => row(escapeHtml(name), income, itemsText(income.topItems || []), itemsText(income.topUsed || []))).join('') +
      missing
        .map((account) => `<tr><td>${escapeHtml(account.name)}</td><td colspan="9" style="text-align:center;color:#f59e0b">-</td><td class="items" colspan="3" style="color:#f59e0b">${escapeHtml(missingReason(account))}</td></tr>`)
        .join('') +
      row(
        `合計（${rows.length} 個帳號${missing.length ? `，另有 ${missing.length} 個沒資料` : ''}）`,
        total.hasLedger
          ? { ...total, topIn: [...total.inMap.entries()].sort(([, first], [, second]) => second - first), topOut: [...total.outMap.entries()].sort(([, first], [, second]) => second - first) }
          : { ...total, net: undefined },
        itemsText([...total.itemMap.entries()].sort(([, first], [, second]) => second - first).slice(0, 8)),
        itemsText([...total.usedMap.entries()].sort(([, first], [, second]) => second - first).slice(0, 6)),
        'total'
      );
  }

  // 鍛造管理：每個帳號一塊，指令送到正在跑鍛造的分頁（沒有就送最新回報的）
  const FORGE_TYPES = { 單手劍: 16, 細劍: 14, 短刀: 11, 單手錘: 16, 盾牌: 16, 雙手劍: 22, 太刀: 20, 雙手斧: 22, 長槍: 18, 頭盔: 10, 帽子: 10, 盔甲: 16, 大衣: 12, 項鍊: 6 };
  let forgeTargets = [];
  let lastForgeAccounts = [];
  // 正在編哪個角色的配方：{ target, heroId }；heroId 是 'new' 就是加入新角色
  let forgeEditing = null;

  function renderForgeBoard(accounts) {
    lastForgeAccounts = accounts;
    const byAccount = new Map();
    [...accounts]
      .filter((account) => account.data.forgeBoard)
      .sort((first, second) => Number(first.data.forgeBoard.running) - Number(second.data.forgeBoard.running) || first.at - second.at)
      .forEach((account) => byAccount.set(account.data.accountId ?? account.id, account));
    forgeTargets = [...byAccount.values()];
    document.getElementById('forge-board').style.display = forgeTargets.length ? '' : 'none';
    const body = document.getElementById('forge-board-body');
    // 正在編配方或打字時先不重畫，不然會被洗掉
    if (forgeEditing || body.contains(document.activeElement)) return;
    body.innerHTML = forgeTargets.map(forgeAccountHtml).join('');
  }

  function forgeChips(materials) {
    return materials
      .map((material) => `<span class="chip ${material.have !== null && material.have < material.quantity ? 'short' : ''}" title="庫存 ${material.have ?? '?'}">${escapeHtml(material.name)}×${material.quantity}</span>`)
      .join('');
  }

  function forgeHeroHtml(account, row) {
    const editing = forgeEditing && forgeEditing.target === account.id && forgeEditing.heroId === row.heroId;
    return `<div class="forge-hero ${row.next ? 'next' : ''}">
      <div class="line"><b>${escapeHtml(row.name)}</b><span class="status" style="color:${row.statusColor}">${escapeHtml(row.statusText)}</span></div>
      <div class="line"><span class="type">${escapeHtml(row.type || '?')}</span><button class="small" data-forge-purpose="${row.heroId}" data-purpose="${row.purpose === 'sell' ? 'use' : 'sell'}" title="用：武器挑攻擊、防具挑防禦；賣（鍊金）：挑耐久、智、幸，不看重量。按一下切換" style="${row.purpose === 'sell' ? 'color:#fbbf24' : ''}">用途：${row.purpose === 'sell' ? '賣（鍊金）' : '用'}</button>「${escapeHtml(row.itemName)}」${row.ownName ? '' : '<span class="muted">（帳號的名稱）</span>'}</div>
      <div>${forgeChips(row.materials) || '<span class="muted">沒有配方</span>'}
        ${row.materials.length ? `<span class="muted">共 ${row.total}${row.cap ? `/${row.cap}` : ''}</span>` : ''}
        ${row.possible === null ? '' : `<span style="color:${row.possible ? '#4ade80' : '#f87171'}">・夠 ${row.possible} 爐</span>`}</div>
      ${row.problems.length ? `<div style="color:#f87171">⚠ ${escapeHtml(row.problems.join('；'))}</div>` : ''}
      <div class="line" style="justify-content:flex-end">${forgeFavoriteSelectHtml(account, row)}<button class="small" data-forge-edit="${row.heroId}">編輯配方</button><button class="small" data-forge-unqueue="${row.heroId}">移出</button></div>
      ${editing ? forgeEditorHtml(account, row.heroId) : ''}
    </div>`;
  }

  // 我的最愛排前面，再來是照鍛造紀錄排名的歷史配方
  // 一鍵換成同類型的最愛配方（名稱不變）
  function forgeFavoriteSelectHtml(account, row) {
    const favorites = (account.data.forgeBoard.favorites || []).filter((item) => item.type === row.type);
    if (!favorites.length) return '';
    return `<select data-forge-fav="${row.heroId}" data-type="${escapeHtml(row.type)}" data-name="${row.ownName ? escapeHtml(row.itemName) : ''}" style="max-width:150px">
      <option value="">★ 換最愛配方</option>${favorites.map((item) => `<option value="${escapeHtml(item.recipe)}">${escapeHtml(item.recipe)}</option>`).join('')}</select>`;
  }

  function forgeRecipeOptionsHtml(forge, type) {
    const favorites = (forge.favorites || [])
      .filter((item) => item.type === type)
      .map((item) => `<option value="${escapeHtml(item.recipe)}">★ ${escapeHtml(item.recipe)}</option>`)
      .join('');
    const history = (forge.recipeOptions[type] || [])
      .map((recipe) => `<option value="${escapeHtml(recipe.key)}">${escapeHtml(recipe.key)}（${escapeHtml(recipe.goal)} ${recipe.score}，${recipe.count} 件）</option>`)
      .join('');
    return `${favorites ? `<optgroup label="我的最愛">${favorites}</optgroup>` : ''}${history ? `<optgroup label="歷史配方">${history}</optgroup>` : ''}`;
  }

  function forgeEditorHtml(account, heroId) {
    const forge = account.data.forgeBoard;
    const plan = (forge.plans && forge.plans[heroId]) || { type: forge.recipeType, recipe: forge.recipe, name: '' };
    const ownName = plan.name && plan.name !== forge.itemName ? plan.name : '';
    const heroSelect =
      heroId === 'new'
        ? `<span>角色</span><select data-edit="hero">${forge.candidates.map((hero) => `<option value="${hero.id}">${escapeHtml(hero.name)}（鍛 ${hero.forge ?? '?'}／裁 ${hero.tailor ?? '?'}／工 ${hero.craft ?? '?'}）</option>`).join('')}</select>`
        : '';
    return `<div class="forge-editor" data-editor>
      ${heroSelect}
      <span>類型</span><select data-edit="type">${Object.keys(FORGE_TYPES).map((type) => `<option ${type === plan.type ? 'selected' : ''}>${type}</option>`).join('')}</select>
      <span>挑配方</span><select data-edit="pick"><option value="">（自己填）</option>${forgeRecipeOptionsHtml(forge, plan.type)}</select>
      <span>配方</span><input data-edit="recipe" value="${escapeHtml(plan.recipe || '')}" placeholder="鐵×10、銅×6">
      <span></span><span class="muted" data-edit-check></span>
      <span>名稱</span><input data-edit="name" value="${escapeHtml(ownName)}" placeholder="空白＝用帳號的名稱（${escapeHtml(forge.itemName || '')}）">
      <span></span><span><button class="small" data-forge-cmd="save">儲存</button> <button class="small" data-forge-cmd="cancel">取消</button></span>
    </div>`;
  }

  function forgeAccountHtml(account) {
    const forge = account.data.forgeBoard;
    const adding = forgeEditing && forgeEditing.target === account.id && forgeEditing.heroId === 'new';
    return `<div class="forge-account" data-forge-target="${escapeHtml(account.id)}">
      <div class="title"><b>${escapeHtml(account.data.nickname)}</b>
        <button class="small ${forge.running ? 'on' : ''}" data-forge-cmd="forge">開</button><button class="small" data-forge-cmd="stop-forge">停</button>
        <span class="muted">欄位 ${forge.forging}/${forge.shops || '?'}・已開 ${forge.started}${forge.limit ? `/${forge.limit}` : ''} 爐</span></div>
      ${forge.note ? `<div style="color:#f59e0b;font-size:13px">${escapeHtml(forge.note)}</div>` : ''}
      <div class="settings">
        <span>欄位 <input type="number" min="0" style="width:44px" data-forge-field="forgeShopSlots" value="${forge.slots}" title="0＝自動讀遊戲"></span>
        <span>開 <input type="number" min="0" style="width:44px" data-forge-field="forgeByApiCount" value="${forge.limit}" title="0＝不限"> 爐</span>
        <span>名稱 <input style="width:100px" data-forge-name value="${escapeHtml(forge.itemName || '')}"> <button class="small" data-forge-cmd="name">套用</button></span>
        ${forge.autoName ? `<span>自動換名稱門檻 <input type="number" min="0" max="100" step="0.5" style="width:52px" data-forge-field="forgeAutoNamePercent" value="${forge.autoNamePercent}"> %</span>` : ''}
      </div>
      ${forge.rows.map((row) => forgeHeroHtml(account, row)).join('') || '<div class="muted">佇列是空的</div>'}
      ${adding ? `<div class="forge-hero">${forgeEditorHtml(account, 'new')}</div>` : forge.candidates.length ? '<button class="small" data-forge-cmd="add">＋ 加入角色</button>' : ''}
    </div>`;
  }

  // 配方欄打字時馬上算總數、上限、庫存夠幾爐
  function checkForgeEditor(editor, account) {
    const forge = account.data.forgeBoard;
    const type = editor.querySelector('[data-edit="type"]').value;
    const text = editor.querySelector('[data-edit="recipe"]').value;
    const parts = text.split(/[、,，\n]/).map((part) => part.trim()).filter(Boolean);
    const recipe = parts.map((part) => /^(.+?)\s*[×xX*＊]\s*(\d+)$/.exec(part)).map((match) => (match ? [match[1].trim(), Number(match[2])] : null));
    const check = editor.querySelector('[data-edit-check]');
    if (!parts.length) return (check.textContent = '寫成 名稱×數量，用、分開');
    if (recipe.includes(null)) return (check.innerHTML = '<span style="color:#f87171">有一段看不懂，要寫成 名稱×數量</span>');
    const total = recipe.reduce((sum, [, quantity]) => sum + quantity, 0);
    const have = new Map(forge.mines || []);
    const possible = Math.min(...recipe.map(([name, quantity]) => Math.floor((have.get(name) || 0) / quantity)));
    const over = total > FORGE_TYPES[type];
    check.innerHTML = `<span style="color:${over ? '#f87171' : 'inherit'}">共 ${total}/${FORGE_TYPES[type]}</span>${have.size ? `・<span style="color:${possible ? '#4ade80' : '#f87171'}">夠 ${possible} 爐</span>` : ''}`;
  }

  function forgeBoardSent(text) {
    document.getElementById('forge-board-text').textContent = `${text}（${new Date().toLocaleTimeString('zh-TW', { hour12: false })}）`;
  }

  function closeForgeEditor() {
    forgeEditing = null;
    document.activeElement && document.activeElement.blur();
    renderForgeBoard(lastForgeAccounts);
  }

  document.getElementById('forge-board-body').addEventListener('click', (event) => {
    const block = event.target.closest('[data-forge-target]');
    if (!block || event.target.tagName !== 'BUTTON') return;
    const target = block.dataset.forgeTarget;
    const account = forgeTargets.find((item) => item.id === target);
    const { forgeUnqueue: unqueue, forgeEdit: edit, forgeCmd: command, forgePurpose: purposeHero } = event.target.dataset;
    if (purposeHero) {
      sendCommand(target, { type: 'forge-purpose', heroId: Number(purposeHero), purpose: event.target.dataset.purpose });
      event.target.blur();
      forgeBoardSent('用途已送出，分頁 5 秒內換名稱');
      return;
    }
    if (edit) {
      forgeEditing = { target, heroId: Number(edit) };
      renderForgeBoardNow();
      return;
    }
    if (command === 'add') {
      forgeEditing = { target, heroId: 'new' };
      renderForgeBoardNow();
      return;
    }
    if (command === 'cancel') return closeForgeEditor();
    if (command === 'save') {
      const editor = event.target.closest('[data-editor]');
      const value = (field) => editor.querySelector(`[data-edit="${field}"]`).value;
      const heroId = forgeEditing.heroId === 'new' ? Number(value('hero')) : forgeEditing.heroId;
      sendCommand(target, { type: 'forge-plan', heroId, itemType: value('type'), recipe: value('recipe'), name: value('name') });
      forgeBoardSent(`${account ? account.data.nickname : ''} 配方已送出，分頁 5 秒內套用（不對的話看卡片上的「上一個指令」）`);
      return closeForgeEditor();
    }
    if (unqueue) sendCommand(target, { type: 'forge-unqueue', heroId: Number(unqueue) });
    else if (command === 'forge' || command === 'stop-forge') sendCommand(target, { type: command });
    else if (command === 'name') sendCommand(target, { type: 'forge-name', name: block.querySelector('[data-forge-name]').value });
    else return;
    event.target.blur();
    forgeBoardSent('已送出，分頁 5 秒內處理');
  });

  // 開編輯器時不等下一次輪詢，馬上畫出來
  function renderForgeBoardNow() {
    const body = document.getElementById('forge-board-body');
    body.innerHTML = forgeTargets.map(forgeAccountHtml).join('');
    const editor = body.querySelector('[data-editor]');
    const account = forgeTargets.find((item) => item.id === forgeEditing.target);
    if (editor && account) checkForgeEditor(editor, account);
  }

  document.getElementById('forge-board-body').addEventListener('input', (event) => {
    const editor = event.target.closest('[data-editor]');
    const account = forgeTargets.find((item) => item.id === (event.target.closest('[data-forge-target]') || {}).dataset?.forgeTarget);
    if (editor && account && event.target.dataset.edit === 'recipe') checkForgeEditor(editor, account);
  });
  document.getElementById('forge-board-body').addEventListener('change', (event) => {
    const block = event.target.closest('[data-forge-target]');
    if (!block) return;
    const account = forgeTargets.find((item) => item.id === block.dataset.forgeTarget);
    const editor = event.target.closest('[data-editor]');
    const edit = event.target.dataset.edit;
    if (editor && account && edit === 'type') {
      editor.querySelector('[data-edit="pick"]').innerHTML = `<option value="">（自己填）</option>${forgeRecipeOptionsHtml(account.data.forgeBoard, event.target.value)}`;
      checkForgeEditor(editor, account);
      return;
    }
    if (editor && account && edit === 'pick') {
      if (event.target.value) editor.querySelector('[data-edit="recipe"]').value = event.target.value;
      checkForgeEditor(editor, account);
      return;
    }
    const favoriteHero = event.target.dataset.forgeFav;
    if (favoriteHero && event.target.value) {
      sendCommand(block.dataset.forgeTarget, { type: 'forge-plan', heroId: Number(favoriteHero), itemType: event.target.dataset.type, recipe: event.target.value, name: event.target.dataset.name || '' });
      event.target.blur();
      forgeBoardSent('配方已送出');
      return;
    }
    const field = event.target.dataset.forgeField;
    if (!field) return;
    sendCommand(block.dataset.forgeTarget, { type: 'forge-setting', field, value: Number(event.target.value) || 0 });
    event.target.blur();
    forgeBoardSent('已送出');
  });
  document.getElementById('forge-name-all-send').addEventListener('click', () => {
    const name = document.getElementById('forge-name-all').value.trim();
    if (!name) return;
    forgeTargets.forEach((account) => sendCommand(account.id, { type: 'forge-name', name }));
    forgeBoardSent(`名稱「${name}」送給 ${forgeTargets.length} 個帳號`);
  });
  document.getElementById('forge-start-all').addEventListener('click', () => {
    forgeTargets.forEach((account) => sendCommand(account.id, { type: 'forge' }));
    forgeBoardSent(`${forgeTargets.length} 個帳號開始鍛造`);
  });
  document.getElementById('forge-stop-all').addEventListener('click', () => {
    forgeTargets.forEach((account) => sendCommand(account.id, { type: 'stop-forge' }));
    forgeBoardSent(`${forgeTargets.length} 個帳號停止鍛造`);
  });

  // 按下去馬上看得到有送出（框線），等分頁回報後畫面會換成新的狀態
  document.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-command], button[data-forge-cmd], button[data-forge-unqueue], button[data-main], button[data-low], button[data-global]');
    if (button) button.classList.add('sent');
  }, true);

  document.getElementById('income-board').addEventListener('click', (event) => {
    const key = event.target.dataset.incomePeriod;
    if (!key) return;
    incomePeriod = key;
    try {
      localStorage.setItem(INCOME_PERIOD_STORAGE_KEY, key);
    } catch {
      // 記不住只影響下次開啟
    }
    renderIncomeBoard(lastIncomeAccounts);
  });

  function viewHtml(account, now) {
    const data = account.data;
    const age = Math.round((now - account.at) / 1000);
    const forge = data.role === 'forge';
    const forgeData = data.forge || { progress: '', heroes: [] };
    const body = forge
      ? `${forgeData.progress ? `<div class="forge-progress">鍛造坊進度　${escapeHtml(forgeData.progress)}</div>` : ''}
        ${forgeData.heroes.map(forgeHeroHtml).join('') || '<div class="muted">沒有正在鍛造的角色</div>'}`
      : data.heroes.map(heroHtml).join('') || '<div class="muted">還沒讀到隊伍</div>';
    return `
      <div class="top"><span class="name"><span class="focus-name" data-focus="${escapeHtml(data.nickname)}" data-focus-id="${Number(data.accountId) || ''}" title="切到這個帳號的瀏覽器視窗">${escapeHtml(data.nickname)}</span>
        <span class="badge ${forge ? 'forge' : 'hunt'}">${forge ? '鍛造分頁' : '狩獵分頁'}</span>
        ${versionHtml(data.version)}</span>
        <span><span class="money">💰 ${Number(data.money || 0).toLocaleString()}</span>
        <button class="small" data-toggle title="縮小／展開">${collapsed.has(account.id) ? '＋' : '－'}</button></span></div>
      <div>${badgeHtml(data)} <span class="muted">${data.location && (!forge || data.huntRunning) ? `${escapeHtml(data.location)}・` : ''}${age} 秒前</span></div>
      ${modeHtml(data)}
      ${data.alert ? `<div class="alert-text">⚠ ${escapeHtml(data.alert)}</div>` : ''}
      <div class="brief muted" data-role="brief">${escapeHtml(briefText(data))}</div>
      <div data-role="detail">
      ${body}
      ${incomeHtml(data)}
      ${miningHtml(data)}
      ${actorLootHtml(data)}
      <div class="status">${escapeHtml(data.status)}</div>
      ${data.lastAction ? `<div class="status last-action ${data.lastAction.text.includes('⚠') ? 'stuck' : ''}">${escapeHtml(data.lastAction.text)}</div>` : ''}
      ${data.lastCommand ? `<div class="status">上一個指令：${escapeHtml(data.lastCommand)}</div>` : ''}
      ${account.pending ? `<div class="status">還有 ${account.pending} 個指令等分頁取走</div>` : ''}
      </div>`;
  }

  // 中繼站同步設定裡的主帳號（renderLow 更新）
  let mainAccountName = '';

  // 掛機和 API 鍛造可以同時跑，各自開關；亮的是現在在跑的
  function modeHtml(data) {
    if (!('huntRunning' in data)) return '';
    const isMain = mainAccountName && mainAccountName === data.nickname;
    const queue = data.forgeQueue;
    const queueText = queue
      ? `佇列 ${queue.queued} 角・欄位 ${queue.forging}/${queue.shops || '?'}${queue.limit ? `・已開 ${queue.started}/${queue.limit} 爐` : queue.started ? `・已開 ${queue.started} 爐` : ''}`
      : '';
    return `<div class="row mode">
      <span class="hunt-only">掛機</span><button class="hunt-only ${data.huntRunning ? 'on' : ''}" data-command="start">開</button><button class="hunt-only" data-command="stop-hunt">停</button>
      <span>鍛造</span><button class="${data.forgeRunning ? 'on' : ''}" data-command="forge">開</button><button data-command="stop-forge">停</button>
      ${'miningRunning' in data ? `<span>挖礦</span><button class="${data.miningRunning ? 'on' : ''}" data-command="mine">開</button><button data-command="stop-mine">停</button>` : ''}
      ${queueText ? `<span class="muted">${escapeHtml(queueText)}</span>` : ''}
      <button class="${isMain ? 'on' : ''}" data-main="${escapeHtml(data.nickname)}" title="${isMain ? '再按一下取消主帳號' : '設成主帳號：其他帳號打怪變慢'}">${isMain ? '★主帳號' : mainAccountName ? '小號' : '設主帳號'}</button>
    </div>`;
  }

  // 操作區只建一次，之後只更新值；每次重畫的話正在輸入的內容會被洗掉
  function controlsHtml() {
    return `<details>
      <summary>遠端操作</summary>
      <div class="row">
        <button data-command="start">開始掛機</button><button data-command="forge">開始鍛造</button>
        <button data-command="stop">停止</button><button data-command="resume" title="按掉警報，用原本的模式重新開始">解除並重開</button>
      </div>
      <div class="row">
        <button data-command="reload">重新整理分頁</button><button data-command="reload-start">重新整理並開始</button>
      </div>
      <div class="row hunt-only">目標
        <select data-key="stageTargetArea"></select> 第 <input type="number" min="0" data-key="stageTargetNumber"> 關
        <button data-command="target">前往</button><button data-command="town">回城</button>
      </div>
      <div class="row hunt-only">${CHECKBOX_FIELDS.map(([key, label]) => `<label><input type="checkbox" data-key="${key}"> ${label}</label>`).join('')}</div>
      <div class="fields hunt-only">${NUMBER_FIELDS.map(([key, label]) => `<span>${label}</span><input type="number" min="0" step="any" data-key="${key}">`).join('')}</div>
      <div class="row hunt-only"><button data-command="fields" title="只送出改過的數值">套用數值</button></div>
    </details>`;
  }

  function holdEdit(input) {
    input.dataset.holdUntil = Date.now() + EDIT_HOLD_MILLISECONDS;
  }

  function fillControls(card, data) {
    const controls = data.controls || {};
    const select = card.querySelector('[data-key="stageTargetArea"]');
    const areas = [...new Set([data.townName, ...(data.areas || []), controls.stageTargetArea].filter(Boolean))];
    const options = areas.map((area) => `<option>${escapeHtml(area)}</option>`).join('');
    if (select.dataset.options !== options) {
      const selected = select.value;
      select.innerHTML = options;
      select.dataset.options = options;
      if (selected) select.value = selected;
    }
    card.querySelectorAll('[data-key]').forEach((input) => {
      const key = input.dataset.key;
      if (!(key in controls) || input === document.activeElement) return;
      // 改過還沒套用、或剛套用還沒回報，都先保留畫面上的值
      if (input.dataset.dirty || Number(input.dataset.holdUntil || 0) > Date.now()) return;
      if (input.type === 'checkbox') input.checked = Boolean(controls[key]);
      else input.value = controls[key];
    });
  }

  function createCard(accountId) {
    const card = document.createElement('div');
    card.innerHTML = `<div data-role="view"></div>${controlsHtml()}`;
    card.addEventListener('input', (event) => {
      if (event.target.dataset.key && event.target.type !== 'checkbox') event.target.dataset.dirty = '1';
    });
    card.addEventListener('change', (event) => {
      const input = event.target;
      if (input.type !== 'checkbox' || !input.dataset.key) return;
      holdEdit(input);
      sendCommand(accountId, { type: 'field', field: input.dataset.key, value: input.checked });
    });
    card.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.toggle !== undefined) {
        setCollapsed(accountId, !collapsed.has(accountId));
        button.textContent = collapsed.has(accountId) ? '＋' : '－';
        return;
      }
      if (button.dataset.heal) {
        sendCommand(accountId, { type: 'heal', heroId: Number(button.dataset.hero), group: button.dataset.heal });
        return;
      }
      const action = button.dataset.command;
      if (['start', 'forge', 'stop', 'stop-hunt', 'stop-forge', 'mine', 'stop-mine', 'resume', 'town'].includes(action)) {
        sendCommand(accountId, { type: action });
      } else if (action === 'mining-collect') {
        sendCommand(accountId, { type: 'mining-collect', site: Number(button.dataset.site) || 0, foreman: collectWithForeman });
      } else if (action === 'mining-ignore') {
        sendCommand(accountId, { type: 'mining-ignore', name: button.dataset.name, ignore: Boolean(button.dataset.ignore) });
      } else if (action === 'reload' || action === 'reload-start') {
        sendCommand(accountId, { type: 'reload', autoStart: action === 'reload-start' });
      } else if (action === 'target') {
        const area = card.querySelector('[data-key="stageTargetArea"]');
        const number = card.querySelector('[data-key="stageTargetNumber"]');
        [area, number].forEach((input) => {
          delete input.dataset.dirty;
          holdEdit(input);
        });
        sendCommand(accountId, { type: 'target', area: area.value, number: Number(number.value) || 0 });
      } else if (action === 'fields') {
        card.querySelectorAll('.fields [data-key][data-dirty]').forEach((input) => {
          delete input.dataset.dirty;
          holdEdit(input);
          sendCommand(accountId, { type: 'field', field: input.dataset.key, value: Number(input.value) });
        });
      }
    });
    document.getElementById('grid').appendChild(card);
    cards.set(accountId, card);
    return card;
  }

  function updateCard(account, now) {
    const card = cards.get(account.id) || createCard(account.id);
    const data = account.data;
    latestData.set(account.id, data);
    // 鍛造分頁不顯示狩獵隊伍，陣亡警示交給狩獵分頁
    const dead = data.role !== 'forge' && data.heroes.some((hero) => hero.perished || hero.hp === 0);
    card.className = [
      'card',
      data.role === 'forge' ? 'forge' : 'hunt',
      data.alert || dead ? 'alert' : '',
      collapsed.has(account.id) ? 'collapsed' : '',
    ].join(' ');
    card.querySelector('[data-role="view"]').innerHTML = viewHtml(account, now);
    fillControls(card, data);
  }

  async function refresh() {
    try {
      const { now, accounts: reported } = await (await fetch('/status', { cache: 'no-store' })).json();
      latestVersion = await fetch('/version', { cache: 'no-store' })
        .then((response) => (response.ok ? response.text() : ''))
        .then((text) => text.trim())
        .catch(() => '');
      const accounts = reported.filter((account) => now - account.at <= OFFLINE_MILLISECONDS);
      // 舊版中繼站沒有 pending 欄位，也沒有 /command，按什麼都不會生效
      const oldServer = accounts.some((account) => !('pending' in account));
      // 分頁關掉、關掉回報或太久沒回報都拿掉，再回報時會重新出現
      const alive = new Set(accounts.map((account) => account.id));
      [...cards.keys()].filter((id) => !alive.has(id)).forEach((id) => {
        cards.get(id).remove();
        cards.delete(id);
      });
      document.getElementById('empty').style.display = accounts.length ? 'none' : '';
      if (accounts.length) {
        accounts.forEach((account) => updateCard(account, now));
        // 同一個帳號開兩個分頁時錢是同一份，只算最新回報的那個
        const moneyByAccount = new Map();
        [...accounts]
          .sort((first, second) => first.at - second.at)
          .forEach((account) => moneyByAccount.set(account.data.accountId ?? account.id, Number(account.data.money || 0)));
        const total = [...moneyByAccount.values()].reduce((sum, money) => sum + money, 0);
        document.getElementById('total').textContent = `合計 💰 ${total.toLocaleString()}`;
        renderIncomeBoard(accounts);
      }
      renderForgeBoard(accounts);
      renderQueue(accounts, now);
      renderGlobal(await fetch('/global', { cache: 'no-store' }).then((response) => (response.ok ? response.json() : null)).catch(() => null));
      renderLow(await readShared());
      renderRestSchedule(accounts, now);
      const updated = document.getElementById('updated');
      updated.textContent = oldServer
        ? 'monitor-server.ps1 是舊版，遠端操作不會生效，請關掉重開'
        : `更新於 ${new Date().toLocaleTimeString('zh-TW', { hour12: false })}`;
      updated.style.color = oldServer ? '#ffe066' : '';
    } catch {
      document.getElementById('updated').textContent = '連不上 monitor-server.ps1，請確認它還在執行';
    }
  }

  // 排序總覽：照每個分頁回報的下一步時間排先後
  function renderQueue(accounts, now) {
    const running = accounts
      .filter((account) => account.data.running && account.data.nextActionAt)
      .sort((first, second) => first.data.nextActionAt - second.data.nextActionAt);
    const marks = ['①', '②', '③', '④', '⑤', '⑥'];
    document.getElementById('queue').textContent = running.length
      ? `排序：${running
          .map((account, index) => {
            const seconds = Math.round((account.data.nextActionAt - now) / 1000);
            const when = seconds <= 0 ? '現在' : seconds < 60 ? `${seconds} 秒後` : `${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒後`;
            return `${marks[index] || `${index + 1}.`}${account.data.nickname}${account.data.role === 'forge' ? '（鍛造）' : ''} ${when}`;
          })
          .join(' → ')}`
      : '';
  }

  // 全體暫停：亮起目前的狀態；按鈕直接改中繼站，各分頁 2 秒內跟上
  function renderGlobal(state) {
    const mode = state && ['temp', 'stop'].includes(state.mode) ? state.mode : 'run';
    document.querySelectorAll('[data-global]').forEach((button) => {
      if (button.dataset.global === mode) button.dataset.current = mode;
      else delete button.dataset.current;
    });
    document.getElementById('global-text').textContent =
      mode === 'temp' ? `${Math.ceil((state.until - state.now) / 60000)} 分鐘後自動開始` : mode === 'stop' ? '按「開始」才會繼續' : '';
  }

  document.querySelectorAll('[data-global]').forEach((button) =>
    button.addEventListener('click', async () => {
      const minutes = Math.max(1, Number(document.getElementById('global-minutes').value) || 10);
      const response = await fetch(`/global?mode=${button.dataset.global}&minutes=${minutes}`, { method: 'POST' }).catch(() => null);
      if (response && response.ok) renderGlobal(await response.json());
    })
  );

  // 低調模式：改中繼站上「三個帳號同步」那份設定，各分頁 10 秒內跟上（分頁要勾「三個帳號同步」）
  async function readShared() {
    return fetch('/shared', { cache: 'no-store' }).then((response) => (response.ok ? response.json() : null)).catch(() => null);
  }

  let lowMinutesHoldUntil = 0;
  let lowTextHoldUntil = 0;

  function renderLow(shared) {
    const values = (shared && shared.values) || {};
    const known = 'lowProfileEnabled' in values;
    const mode = !known ? '' : !values.lowProfileEnabled ? 'off' : ['casual', 'auto'].includes(values.lowProfileStyle) ? values.lowProfileStyle : 'serious';
    document.querySelectorAll('[data-low]').forEach((button) => button.toggleAttribute('data-low-current', button.dataset.low === mode));
    const minutes = document.getElementById('low-casual-minutes');
    if (document.activeElement !== minutes && Date.now() > lowMinutesHoldUntil) minutes.value = values.lowProfileCasualMinutes ?? 20;
    const hours = document.getElementById('low-serious-hours');
    if (document.activeElement !== hours && Date.now() > lowMinutesHoldUntil) hours.value = values.lowProfileSeriousHours ?? '20-24';
    const off = document.getElementById('low-off-hours');
    if (document.activeElement !== off && Date.now() > lowMinutesHoldUntil) off.value = values.lowProfileOffHours ?? '';
    const sleep = document.getElementById('low-sleep-hours');
    if (document.activeElement !== sleep && Date.now() > lowMinutesHoldUntil) sleep.value = values.lowProfileSleepHours ?? '';
    const side = document.getElementById('side-hunt-percent');
    if (document.activeElement !== side && Date.now() > lowMinutesHoldUntil) side.value = values.sideHuntPercent ?? 50;
    mainAccountName = String(values.mainAccountName || '').trim();
    if (!known) document.getElementById('low-text').textContent = '還沒有帳號送過同步設定';
    else if (Date.now() > lowTextHoldUntil) document.getElementById('low-text').textContent = '';
  }

  // 各分頁算出來的實際作息；三個帳號同步時都一樣，只顯示一次，不一樣才分帳號列
  function renderRestSchedule(accounts, now) {
    const clock = (time) => {
      const date = new Date(time);
      const text = date.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
      return date.toDateString() === new Date(now).toDateString() ? text : `明天 ${text}`;
    };
    const range = ([start, end]) => `${clock(start)}–${clock(end)}${now >= start && now < end ? '（現在）' : ''}`;
    const texts = new Map();
    accounts.forEach((account) => {
      const schedule = account.data.restSchedule;
      if (!schedule || schedule.error) return;
      const parts = [];
      if (schedule.sleep) parts.push(`睡覺 ${range(schedule.sleep)}`);
      if (schedule.off && schedule.off.length) parts.push(`完全休息 ${schedule.off.map(range).join('、')}`);
      const text = parts.join('｜');
      if (text) texts.set(text, [...(texts.get(text) || []), account.data.nickname]);
    });
    document.getElementById('low-schedule').textContent =
      texts.size > 1 ? [...texts].map(([text, names]) => `${names.join('、')}：${text}`).join('　') : [...texts.keys()][0] || '';
  }

  async function changeLow(changes) {
    const shared = (await readShared()) || {};
    const values = { ...(shared.values || {}), ...changes };
    const response = await fetch('/shared', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ at: Date.now(), values }) }).catch(() => null);
    lowTextHoldUntil = Date.now() + 10000;
    document.getElementById('low-text').textContent = response && response.ok ? '已送出，各分頁 10 秒內跟上' : '送不出去（中繼站有開嗎？）';
    renderLow({ values });
  }

  document.querySelectorAll('[data-low]').forEach((button) =>
    button.addEventListener('click', () => {
      const mode = button.dataset.low;
      changeLow(mode === 'off' ? { lowProfileEnabled: false } : { lowProfileEnabled: true, lowProfileStyle: mode });
    })
  );
  document.getElementById('side-hunt-percent').addEventListener('change', (event) => {
    lowMinutesHoldUntil = Date.now() + 15000;
    changeLow({ sideHuntPercent: Math.min(100, Math.max(10, Number(event.target.value) || 50)) });
  });
  document.getElementById('grid').addEventListener('click', (event) => {
    const target = event.target.closest('[data-main]');
    if (!target) return;
    event.stopPropagation();
    const name = target.dataset.main === mainAccountName ? '' : target.dataset.main;
    mainAccountName = name;
    changeLow({ mainAccountName: name });
  });
  document.getElementById('low-sleep-hours').addEventListener('change', (event) => {
    lowMinutesHoldUntil = Date.now() + 15000;
    changeLow({ lowProfileSleepHours: event.target.value.trim() });
  });
  document.getElementById('low-off-hours').addEventListener('change', (event) => {
    lowMinutesHoldUntil = Date.now() + 15000;
    changeLow({ lowProfileOffHours: event.target.value.trim() });
  });
  document.getElementById('low-serious-hours').addEventListener('change', (event) => {
    lowMinutesHoldUntil = Date.now() + 15000;
    changeLow({ lowProfileSeriousHours: event.target.value.trim() });
  });
  document.getElementById('low-casual-minutes').addEventListener('change', (event) => {
    lowMinutesHoldUntil = Date.now() + 15000;
    changeLow({ lowProfileCasualMinutes: Math.min(60, Math.max(0, Number(event.target.value) || 0)) });
  });

  // 點帳號名稱：中繼站找標題是「名稱｜…」的瀏覽器視窗拉到最上層
  document.getElementById('grid').addEventListener('click', async (event) => {
    const target = event.target.closest('[data-focus]');
    if (!target) return;
    const updated = document.getElementById('updated');
    const response = await fetch(`/focus?id=${encodeURIComponent(target.dataset.focusId)}`, { method: 'POST' }).catch(() => null);
    const result = response && response.ok ? (await response.json()).result : response ? `HTTP ${response.status}（中繼站要重開）` : '連不上中繼站';
    updated.textContent = {
      ok: `已切到「${target.dataset.focus}」`,
      notfound: `找不到「${target.dataset.focus}」的視窗：遊戲分頁要是那個視窗正在顯示的分頁（腳本要 3.21 以上）`,
      blocked: `Windows 擋住了切換，「${target.dataset.focus}」的視窗在工作列上閃，點一下就好`,
    }[result] || `切換失敗：${result}`;
  });

  // 最近一次回報的內容，全部重新整理時用來決定哪些分頁要自動接著跑
  const latestData = new Map();

  document.getElementById('reload-all').addEventListener('click', () => {
    if (!confirm(`要重新整理全部 ${cards.size} 個分頁嗎？原本在跑的會自動接著跑`)) return;
    cards.forEach((card, accountId) => {
      const data = latestData.get(accountId) || {};
      sendCommand(accountId, { type: 'reload', autoStart: Boolean(data.running) });
    });
  });

  document.getElementById('collapse-all').addEventListener('click', () => {
    cards.forEach((card, accountId) => setCollapsed(accountId, true));
    refresh();
  });
  document.getElementById('expand-all').addEventListener('click', () => {
    cards.forEach((card, accountId) => setCollapsed(accountId, false));
    refresh();
  });

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
